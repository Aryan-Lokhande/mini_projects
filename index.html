<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="services" class="features py-5">
      <div class="container text-center">
        <!-- Title -->
        <h2 class="mb-4">Mini Projects</h2>

        <!-- Feature Blocks -->
        <div class="row justify-content-center">
          <!-- First Feature -->
          <div
            class="col-lg-3 col-md-6 mb-4"
            data-aos="fade-up"
            data-aos-duration="1000"
          >
            <div class="card shadow-sm p-4 pop-up">
              <div class="circle bg-pink mb-3"></div>
              <h5 class="card-title">Simon Game</h5>
              <img src="image/simon.png" alt="Simon" class="card-img" />
              <a href="SimonGame/index.html" class="btn btn-primary">View</a>
            </div>
          </div>

          <!-- Second Feature -->
          <div
            class="col-lg-3 col-md-6 mb-4"
            data-aos="fade-down"
            data-aos-duration="1000"
          >
            <div class="card shadow-sm p-4 pop-up">
              <div class="circle bg-3 mb-3"></div>
              <h5 class="card-title">Tic tak toe</h5>
              <img src="image/tic-tak-toe.png" alt="TTT" class="card-img" />
              <a href="Tic-Tac-toe/index.html" class="btn btn-primary">View</a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
      AOS.init();
    </script>
  </body>
</html>
